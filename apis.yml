description: 'AAR CORP. (NYSE: AIR) is a global aerospace and defense aftermarket solutions company and
  the number one aviation maintenance, repair and overhaul (MRO) provider in North America. It supplies
  new and used airframe and engine parts, performs airframe and component MRO, runs expeditionary and
  sustainment programs for government and defense customers on five continents, and operates four aviation
  software businesses — Trax (eMRO/eMobility aviation ERP), Aerostrat (Aerros maintenance scheduling),
  Airvoyant (AI-driven parts procurement, launched April 2026) and Airinmar (component repair and warranty
  management) — whose software covers more than 10,000 aircraft. AAR publishes no developer program, no
  API reference and no machine-readable contract; its only anonymously reachable API surface is the undocumented
  Adobe Commerce webapi behind the AAR PAARTS Store at shop.aarcorp.com/rest/V1/.'
