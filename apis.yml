- aid: aar:aar-paarts-store
  name: AAR PAARTS Store Commerce API
  tags:
  - Aviation
  - Parts Supply
  - E-Commerce
  - Catalog
  - Adobe Commerce
  humanURL: https://shop.aarcorp.com/
  baseURL: https://shop.aarcorp.com/rest/V1
  properties:
  - url: https://shop.aarcorp.com/
    type: Website
  description: 'The AAR PAARTS Store is AAR''s online aviation parts storefront, running on Adobe Commerce
    (Magento 2). It exposes the platform''s standard REST webapi at https://shop.aarcorp.com/rest/V1/
    and a SOAP endpoint at /soap. Verified live on 2026-08-29: GET /rest/V1/directory/currency and GET
    /rest/V1/directory/countries return 200 anonymously, POST /rest/V1/guest-carts returns 200 with a
    guest quote id, and the catalog and store surfaces return 401 with a Magento ACL envelope. AAR publishes
    NO documentation for this surface and the platform''s own schema generator (/rest/all/schema, /soap?wsdl_list=1)
    returns HTTP 500, so no OpenAPI or WSDL can be retrieved. Listed because it is real, callable and
    served from AAR''s own domain — not because AAR offers it as a developer product.'
  x-contract: none published; platform schema endpoint returns HTTP 500
- aid: aar:aar-airvoyant
