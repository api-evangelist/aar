    type: Website
  description: Airvoyant is AAR's AI-driven parts procurement platform, launched April 2026 with Delta
    Air Lines and Air Canada as early adopters and AWS as its agentic-AI technology partner. It connects
    buyers to the Aeroxchange supplier network, searches live inventory, consolidates supplier quotes
    and recommends purchases through an AI agent workforce, integrating with Trax and other ERPs. Despite
    being marketed as agentic, it publishes no API, no MCP server, no agent card and no developer documentation
    — access is by sales demo only.
